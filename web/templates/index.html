<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniLang Compiler - Interfaz Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #e0e0e0;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
        }

        /* Panel principal */
        .main-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Editor de código */
        .code-editor {
            background: #0d1117;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #30363d;
        }

        .code-header {
            background: #161b22;
            padding: 12px 16px;
            border-bottom: 1px solid #30363d;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        textarea {
            width: 100%;
            height: 500px;
            background: #0d1117;
            color: #e6edf3;
            border: none;
            padding: 16px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 14px;
            line-height: 1.5;
            resize: vertical;
            outline: none;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: transform 0.2s, opacity 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }

        /* Panel de resultados */
        .results-panel {
            background: #0d1117;
            border-radius: 12px;
            border: 1px solid #30363d;
            overflow: hidden;
        }

        .tabs {
            display: flex;
            background: #161b22;
            border-bottom: 1px solid #30363d;
        }

        .tab {
            padding: 12px 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.2s;
            border: none;
            background: none;
            color: #8b949e;
        }

        .tab.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }

        .tab:hover {
            background: #21262d;
        }

        .tab-content {
            padding: 16px;
            height: 500px;
            overflow-y: auto;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.5;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        /* Panel de fases */
        .phases-panel {
            background: #0d1117;
            border-radius: 12px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
        }

        .phases-header {
            background: #161b22;
            padding: 12px 16px;
            border-bottom: 1px solid #30363d;
            font-weight: 600;
        }

        .phases-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            padding: 16px;
        }

        .phase-card {
            background: #21262d;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            border-left: 3px solid #8b949e;
        }

        .phase-card.ok {
            border-left-color: #2ea043;
        }

        .phase-card.error {
            border-left-color: #f85149;
        }

        .phase-name {
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .phase-time {
            font-size: 12px;
            color: #8b949e;
        }

        .phase-status {
            font-size: 12px;
            margin-top: 4px;
        }

        .phase-status.ok {
            color: #2ea043;
        }

        .phase-status.error {
            color: #f85149;
        }

        /* Panel de errores */
        .errors-panel {
            background: #0d1117;
            border-radius: 12px;
            border: 1px solid #30363d;
            margin-bottom: 20px;
        }

        .errors-header {
            background: #161b22;
            padding: 12px 16px;
            border-bottom: 1px solid #30363d;
            font-weight: 600;
            color: #f85149;
        }

        .errors-content {
            padding: 16px;
            max-height: 150px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
            color: #f85149;
        }

        /* Panel de consola */
        .console-panel {
            background: #0d1117;
            border-radius: 12px;
            border: 1px solid #30363d;
        }

        .console-header {
            background: #161b22;
            padding: 12px 16px;
            border-bottom: 1px solid #30363d;
            font-weight: 600;
        }

        .console-content {
            padding: 16px;
            max-height: 200px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 13px;
        }

        .console-line {
            color: #e6edf3;
            padding: 2px 0;
        }

        /* Botón de ejemplo */
        .example-btn {
            background: #21262d;
            margin-left: 10px;
        }

        .example-btn:hover {
            background: #30363d;
        }

        /* Loading */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-left: 10px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 1000px) {
            .main-panel {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 MiniLang Compiler</h1>
        <p class="subtitle">Compilador interactivo con soporte para TAC y LLVM IR</p>

        <div class="main-panel">
            <!-- Editor de código -->
            <div class="code-editor">
                <div class="code-header">
                    <span>📝 Editor de código</span>
                    <div>
                        <button class="example-btn" onclick="cargarEjemplo()">📋 Ejemplo</button>
                        <button id="compilarBtn" onclick="compilar()">▶️ Compilar</button>
                    </div>
                </div>
                <textarea id="codigo" placeholder="Escribe tu código MiniLang aquí...">programa {
    entero x = 10;
    entero y = 20;
    entero z;
    
    z = x + y * 2;
    imprimir(z);
    
    si (x > 10 || y < 20) {
        z = x / 2;
    } sino {
        z = y - 5;
    }
    
    imprimir(z);
    
    entero i = 0;
    mientras (i < 5) {
        imprimir(i);
        i = i + 1;
    }
}</textarea>
            </div>

            <!-- Panel de resultados (Tabs) -->
            <div class="results-panel">
                <div class="tabs">
                    <button class="tab active" data-tab="tac">📊 Código TAC</button>
                    <button class="tab" data-tab="ir">⚙️ LLVM IR</button>
                    <button class="tab" data-tab="ir_exec">🔧 Ejecución IR</button>
                </div>
                <div id="tac" class="tab-content" style="display: block;"></div>
                <div id="ir" class="tab-content" style="display: none;"></div>
                <div id="ir_exec" class="tab-content" style="display: none;">Compila un programa para ver la ejecución del archivo .ll con lli</div>
            </div>
        </div>

        <!-- Panel de fases -->
        <div class="phases-panel">
            <div class="phases-header">📈 Fases del Compilador</div>
            <div id="phasesGrid" class="phases-grid">
                <!-- Las fases se generan dinámicamente -->
            </div>
        </div>

        <!-- Panel de errores -->
        <div class="errors-panel" id="errorsPanel" style="display: none;">
            <div class="errors-header">❌ Errores de Compilación</div>
            <div id="errorsContent" class="errors-content"></div>
        </div>

        <!-- Panel de consola -->
        <div class="console-panel">
            <div class="console-header">🖥️ Consola de Salida</div>
            <div id="consoleContent" class="console-content">
                <div class="console-line">💡 Presiona "Compilar" para ejecutar el programa...</div>
            </div>
        </div>
    </div>

    <script>
        // Cambiar entre pestañas
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const target = tab.dataset.tab;
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                document.querySelectorAll('.tab-content').forEach(content => {
                    content.style.display = 'none';
                });
                document.getElementById(target).style.display = 'block';
            });
        });

        async function compilar() {
            const codigo = document.getElementById('codigo').value;
            const compilarBtn = document.getElementById('compilarBtn');
            
            // Mostrar loading
            compilarBtn.innerHTML = '⏳ Compilando...';
            compilarBtn.disabled = true;
            
            // Limpiar paneles anteriores
            document.getElementById('phasesGrid').innerHTML = '';
            document.getElementById('errorsPanel').style.display = 'none';
            document.getElementById('errorsContent').innerHTML = '';
            document.getElementById('consoleContent').innerHTML = '<div class="console-line">⏳ Compilando...</div>';
            document.getElementById('tac').innerHTML = '⏳ Generando TAC...';
            document.getElementById('ir').innerHTML = '⏳ Generando IR...';

            try {
                const response = await fetch('/compilar', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ codigo: codigo })
                });
                
                const data = await response.json();
                
                // Actualizar fases
                if (data.fases && data.fases.length > 0) {
                    const phasesGrid = document.getElementById('phasesGrid');
                    phasesGrid.innerHTML = '';
                    data.fases.forEach(fase => {
                        const card = document.createElement('div');
                        card.className = `phase-card ${fase.estado}`;
                        card.innerHTML = `
                            <div class="phase-name">${fase.nombre}</div>
                            <div class="phase-time">⏱️ ${fase.tiempo}</div>
                            <div class="phase-status ${fase.estado}">${fase.estado === 'ok' ? '✅ Éxito' : '❌ Error'}</div>
                        `;
                        phasesGrid.appendChild(card);
                    });
                }
                
                // Actualizar TAC e IR
                if (data.tac) {
                    document.getElementById('tac').innerHTML = `<pre>${escapeHtml(data.tac)}</pre>`;
                }
                if (data.ir) {
                    document.getElementById('ir').innerHTML = `<pre>${escapeHtml(data.ir)}</pre>`;
                }

                // Panel ejecución IR (lli)
                if (data.ir_output) {
                    const iro = data.ir_output;
                    let html = '';
                    if (iro.disponible && iro.salida) {
                        html = `<div style="color:#2ea043;margin-bottom:8px;">✅ Ejecutado con lli</div><pre>${escapeHtml(iro.salida)}</pre>`;
                    } else if (iro.error) {
                        html = `<div style="color:#f85149;margin-bottom:8px;">⚠️ ${escapeHtml(iro.error)}</div>`;
                        if (iro.salida) html += `<pre>${escapeHtml(iro.salida)}</pre>`;
                    } else {
                        html = '<div style="color:#8b949e;">No se pudo ejecutar el IR.</div>';
                    }
                    document.getElementById('ir_exec').innerHTML = html;
                }
                
                // Actualizar consola
                if (data.salida && data.salida.length > 0) {
                    const consoleHtml = data.salida.map(line => `<div class="console-line">${escapeHtml(line)}</div>`).join('');
                    document.getElementById('consoleContent').innerHTML = consoleHtml;
                } else if (data.exito) {
                    document.getElementById('consoleContent').innerHTML = '<div class="console-line">✅ Programa compilado y ejecutado correctamente (sin salida)</div>';
                }
                
                // Mostrar errores si los hay
                if (data.errores && data.errores.length > 0) {
                    document.getElementById('errorsPanel').style.display = 'block';
                    document.getElementById('errorsContent').innerHTML = data.errores.map(e => `<pre>${escapeHtml(e)}</pre>`).join('');
                    document.getElementById('consoleContent').innerHTML = '<div class="console-line">❌ La compilación falló. Revisa los errores.</div>';
                } else {
                    document.getElementById('errorsPanel').style.display = 'none';
                }
                
            } catch (error) {
                console.error('Error:', error);
                document.getElementById('consoleContent').innerHTML = `<div class="console-line">❌ Error de conexión: ${error.message}</div>`;
                document.getElementById('errorsPanel').style.display = 'block';
                document.getElementById('errorsContent').innerHTML = `<pre>Error de conexión: ${error.message}</pre>`;
            } finally {
                compilarBtn.innerHTML = '▶️ Compilar';
                compilarBtn.disabled = false;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function cargarEjemplo() {
            const ejemplo = `programa {
    entero x = 10;
    entero y = 20;
    entero z;
    
    z = x + y * 2;
    imprimir(z);
    
    si (x > 10 || y < 20) {
        z = x / 2;
    } sino {
        z = y - 5;
    }
    
    imprimir(z);
    
    entero i = 0;
    mientras (i < 5) {
        imprimir(i);
        i = i + 1;
    }
}`;
            document.getElementById('codigo').value = ejemplo;
        }
    </script>
</body>
</html>
